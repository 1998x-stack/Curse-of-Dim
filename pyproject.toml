[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curse-of-dim-lab"
version = "0.1.0"
description = "Reproducible experiments explaining the curse of dimensionality"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "1998x-stack"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "threadpoolctl>=3.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
curse-of-dim = "curse_of_dim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
